<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для тебя</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(circle at center, #1a0b2e 0%, #0d0515 100%);
    color: #fff;
    font-family: 'Georgia', serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Контейнер для 3D-сердца */
  #heart-container {
    position: relative;
    width: 300px;
    height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1000px;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* Текст */
  .text-container {
    position: absolute;
    bottom: 15%;
    text-align: center;
    width: 80%;
    max-width: 600px;
    z-index: 10;
    opacity: 0;
    transition: opacity 2s ease;
  }
  .text-container.show { opacity: 1; }

  h1 {
    font-size: 24px;
    font-weight: normal;
    line-height: 1.6;
    color: #f8bbd0;
    text-shadow: 0 0 15px rgba(248, 187, 208, 0.5);
    margin-bottom: 20px;
    letter-spacing: 1px;
  }

  .btn-love {
    background: transparent;
    color: #f48fb1;
    border: 1px solid #f48fb1;
    padding: 12px 30px;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s ease;
    box-shadow: 0 0 10px rgba(244, 143, 177, 0.2);
  }
  .btn-love:hover {
    background: rgba(244, 143, 177, 0.1);
    box-shadow: 0 0 25px rgba(244, 143, 177, 0.6);
    transform: translateY(-2px);
  }

  /* Взрыв сердца */
  .explosion-text {
    font-size: 28px;
    color: #ffeb3b;
    text-shadow: 0 0 20px #ffeb3b, 0 0 40px #ff9800;
    display: none;
    text-align: center;
    animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  @keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

</style>
</head>
<body>

  <div id="heart-container">
    <canvas id="scene"></canvas>
  </div>

  <div class="text-container" id="text-block">
    <h1>Среди миллиардов людей и бесконечного кода...<br>я нашел свой идеальный алгоритм счастья.<br><br>Это ты.</h1>
    <button class="btn-love" id="main-btn" onclick="openHeart()">Открыть мое сердце</button>
  </div>

  <div class="explosion-text" id="final-text">
    Спасибо, что ты есть. ❤️<br>
    <span style="font-size: 18px; color: #fff;">Станешь моей девушкой?</span>
  </div>

<script>
  // --- 3D СЕРДЦЕ И ЧАСТИЦЫ ---
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let width, height;

  function resize() {
    width = canvas.width = 300;
    height = canvas.height = 300;
  }
  window.addEventListener('resize', resize);
  resize();

  // Формула для создания точек в виде сердца
  function getHeartPoint(t) {
    // Уравнение сердца
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
    return { x: x * 8, y: -y * 8 }; // Масштабируем
  }

  let particles = [];
  
  // Создаем облако точек-сердец
  for (let i = 0; i < 400; i++) {
    const t = Math.PI * 2 * (i / 400);
    const pos = getHeartPoint(t);
    particles.push({
      baseX: pos.x,
      baseY: pos.y,
      x: pos.x,
      y: pos.y,
      vx: 0,
      vy: 0,
      size: Math.random() * 1.5 + 0.5,
      color: `hsla(${Math.random() * 30 + 330}, 80%, 70%, ${Math.random() * 0.5 + 0.5})`, // Розово-красные оттенки
      phase: Math.random() * Math.PI * 2
    });
  }

  let time = 0;
  let isExploding = false;

  function animate() {
    ctx.clearRect(0, 0, width, height);
    ctx.save();
    ctx.translate(width / 2, height / 2);

    time += 0.02;

    particles.forEach(p => {
      if (!isExploding) {
        // Эффект биения и покачивания
        const pulse = Math.sin(time * 3) * 0.05 + 1;
        const driftX = Math.sin(time + p.phase) * 3;
        const driftY = Math.cos(time + p.phase) * 3;
        
        p.x = p.baseX * pulse + driftX;
        p.y = p.baseY * pulse + driftY;
        
        // Рисуем светящуюся точку
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.fill();
      } else {
        // Взрыв
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05; // Гравитация
        p.vx *= 0.99; // Трение
        p.vy *= 0.99;
        
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 1.5, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = p.color;
        ctx.fill();
      }
    });

    ctx.restore();
    requestAnimationFrame(animate);
  }

  animate();

  // Задержка перед появлением текста
  setTimeout(() => {
    document.getElementById('text-block').classList.add('show');
  }, 2500);

  // --- КНОПКА ВЗРЫВА ---
  function openHeart() {
    isExploding = true;
    const textBlock = document.getElementById('text-block');
    const finalText = document.getElementById('final-text');
    
    // Скрываем начальный текст
    textBlock.style.opacity = '0';
    setTimeout(() => {
      textBlock.style.display = 'none';
      finalText.style.display = 'block';
    }, 1000);

    // Задаем случайные скорости для взрыва
    particles.forEach(p => {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 8 + 2;
      p.vx = Math.cos(angle) * speed;
      p.vy = Math.sin(angle) * speed;
    });

    // Через 4 секунды начинаем собирать сердце обратно (опционально можно оставить разлетевшимся)
    setTimeout(() => {
        isExploding = false;
        particles.forEach(p => {
            p.x = p.baseX;
            p.y = p.baseY;
            p.vx = 0;
            p.vy = 0;
        });
    }, 4000);
  }
</script>
</body>
</html>
